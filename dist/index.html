<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trickster (Pixi migration)</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background-color: rgb(27, 27, 27);
    }
    /* The Pixi canvas fills the window; the game scene is scaled + letterboxed
       inside it by PixiApp.fit(). Sprite crispness comes from nearest scaleMode,
       text crispness from per-scale Text resolution — no CSS scaling needed. */
    #app, #app canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
  <script type="module" crossorigin src="/lfz-battle/assets/index-XVzYFARA.js"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
